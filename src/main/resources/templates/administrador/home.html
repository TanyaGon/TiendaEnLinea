<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">

  <title>Cake's Bakery</title>


  <!-- CSS de Bootstrap -->
  <link th:href="@{vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">

  <!-- CSS aparte -->
  <link th:href="@{css/heroic-features.css}" rel="stylesheet">

</head>

<body>

  <!-- Menu -->
  <div th:include="administrador/template_admin.html :: header"></div>

    <!-- Inicio de contenido de la pagina -->
    <div class="container">

      <!-- Primera impresion de la pagina -->
      <header class="jumbotron my-4" th:align="center">
        <h1 class="display-3">Bienvenido a Cake's Bakery</h1>
        <p class="lead">La pasteleria con los mejores precios y sabores de la region</p>
        <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
          <ol class="carousel-indicators">
            <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
          </ol>
          <div class="carousel-inner" th:align="center">
            <div class="carousel-item active" th:align="center">
              <img class="d-block w-75" th:src="@{images/recursos/carrusel1.jpg}" alt="Carrusel 1">
            </div>
            <div class="carousel-item">
              <img class="d-block w-75" th:src="@{images/recursos/carrusel2.jpg}" alt="Carrusel 2">
            </div>
            <div class="carousel-item">
              <img class="d-block w-75" th:src="@{images/recursos/carrusel3.jpg}" alt="Carrusel 3">
            </div>
            <div class="carousel-item">
              <img class="d-block w-75" th:src="@{images/recursos/carrusel4.jpg}" alt="Carrusel 4">
            </div>
          </div>
          <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
          </a>
          <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
          </a>
        </div>
      </header>

      <!-- Productos  -->
      <div class="row text-center">

        <div class="col-lg-3 col-md-6 mb-4" th:each="producto : ${productos}">
          <div class="card h-100">
            <img class="card-img-top" th:src="@{/images/{img} (img = ${producto.imagen})}" alt="">
            <div class="card-body">
              <p class="card-text" th:text="${producto.nombre}"></p>
            </div>
            <div class="card-footer">
              <a th:href="@{/}" class="btn btn-success">Ver producto</a>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- Footer -->
  <div th:include="administrador/template_admin.html :: footer"></div>

    <!-- Bootstrap core JavaScript -->
    <script th:src="@{vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

  </body>

  </html>
